
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | AssetFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101b2d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            background: #192941;
            padding: 50px;
            border-radius: 16px;
            max-width: 480px;
            width: 90%;
        }

        .error-code {
            font-size: 72px;
            color: #3978f6;
            font-weight: bold;
        }

        h2 {
            margin: 15px 0;
        }

        p {
            color: #b8c5d6;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            background: #3978f6;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 7px;
        }

        a:hover {
            background: #255fcc;
        }
    </style>
</head>

<body>

    <div class="error-container">
        <div class="error-code">403</div>

        <h2>Access Denied</h2>

        <p>
            You don't have permission to access this page.
            Please contact your administrator if you need access.
        </p>

        <a th:href="@{/dashboard}">Back to Dashboard</a>
    </div>

</body>
</html>
